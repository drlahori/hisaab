name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --org com.gillani --project-name hisaab --platforms android .

      - name: Apply Hisaab name, icons and icon switching
        run: python3 tool/patch_platform.py

      - name: Add packages
        run: flutter pub add path_provider:^2.1.6 intl:^0.20.3 share_plus:^13.3.1 file_picker:^13.4.1 crypto:^3.0.3 google_sign_in:^7.2.0

      # The same key must sign every build, or Android refuses to update the app.
      - name: Use the permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.HISAAB_KEYSTORE }}
        run: |
          mkdir -p "$HOME/.android"
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Signing with the permanent Hisaab key"
          else
            echo "::warning::HISAAB_KEYSTORE secret is not set, so this build uses a temporary key and cannot update an installed copy."
          fi

      - name: Build APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then echo "::warning::GOOGLE_WEB_CLIENT_ID secret not set, so Google Drive backup is switched off in this build."; fi
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
          cp build/app/outputs/flutter-apk/app-release.apk hisaab.apk

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs hisaab.apk | grep -E "SHA-256|SHA-1" || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hisaab-apk
          path: hisaab.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hisaab build ${{ github.run_number }}
          body: Download hisaab.apk below and open it on your Android phone to install.
          files: hisaab.apk
