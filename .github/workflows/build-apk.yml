name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --org com.gillani --project-name hisaab --platforms android .

      - name: Add packages
        run: flutter pub add path_provider intl share_plus file_picker

      - name: Build APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk hisaab.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hisaab-apk
          path: hisaab.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hisaab build ${{ github.run_number }}
          body: Download hisaab.apk below and open it on your Android phone to install.
          files: hisaab.apk
